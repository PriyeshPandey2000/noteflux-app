<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			background: transparent !important;
			overflow: hidden;
		}
		#strip {
			width: 100%;
			height: 100%;
			background: #000;
			border-radius: 0 0 14px 14px;
		}
	</style>
</head>
<body>
	<div id="strip"></div>
</body>
</html>
