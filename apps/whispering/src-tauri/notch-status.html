<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			background: transparent !important;
			overflow: hidden;
			font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
			-webkit-font-smoothing: antialiased;
			user-select: none;
		}
		#shell {
			width: 100%;
			height: 100%;
			transform: translateY(-100%);
			opacity: 0;
			transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 160ms ease;
		}
		#shell.open {
			transform: translateY(0);
			opacity: 1;
		}
		#pill {
			height: 100%;
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 0 18px;
			background: #000;
			color: #fff;
			border-radius: 18px;
			border: 1px solid rgba(255, 255, 255, 0.07);
			box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.6);
		}
		.spinner {
			width: 14px;
			height: 14px;
			flex-shrink: 0;
			border-radius: 50%;
			border: 2px solid rgba(255, 255, 255, 0.15);
			border-top-color: #4ade80;
			animation: spin 0.7s linear infinite;
		}
		@keyframes spin {
			to { transform: rotate(360deg); }
		}
		.text {
			display: flex;
			flex-direction: column;
			min-width: 0;
		}
		#title {
			font-size: 13px;
			font-weight: 600;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		#detail {
			font-size: 11px;
			color: rgba(255, 255, 255, 0.5);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		#detail:empty {
			display: none;
		}
	</style>
</head>
<body>
	<div id="shell">
		<div id="pill">
			<div class="spinner"></div>
			<div class="text">
				<div id="title"></div>
				<div id="detail"></div>
			</div>
		</div>
	</div>

	<script>
		const shell = document.getElementById('shell');
		const titleEl = document.getElementById('title');
		const detailEl = document.getElementById('detail');

		// Generic: any caller can pass a title and optional detail line.
		window.showNotchStatus = function (title, detail) {
			titleEl.textContent = title || '';
			detailEl.textContent = detail || '';
			shell.classList.remove('open');
			requestAnimationFrame(() => {
				requestAnimationFrame(() => shell.classList.add('open'));
			});
		};
	</script>
</body>
</html>
