<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			background: transparent !important;
			overflow: hidden;
			font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
			-webkit-font-smoothing: antialiased;
		}
		#card {
			margin: 10px;
			background: #1a1a1a;
			color: #fff;
			border-radius: 14px;
			border: 1px solid rgba(255, 255, 255, 0.1);
			box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.6);
			padding: 18px;
		}
		h1 {
			font-size: 13px;
			font-weight: 600;
			color: rgba(255, 255, 255, 0.5);
			margin-bottom: 10px;
		}
		p {
			font-size: 14px;
			line-height: 1.5;
			/* Deliberately selectable, unlike the real overlays. */
			user-select: text;
			-webkit-user-select: text;
			margin-bottom: 14px;
		}
		button {
			font-size: 13px;
			font-weight: 600;
			border: none;
			border-radius: 8px;
			padding: 8px 14px;
			background: #4ade80;
			color: #06240f;
			cursor: pointer;
		}
		button:active {
			background: #22c55e;
		}
		#status {
			margin-top: 10px;
			font-size: 12px;
			color: rgba(255, 255, 255, 0.4);
		}
	</style>
</head>
<body>
	<div id="card">
		<h1>Spike panel — click test</h1>
		<p id="selectable-text">
			Try dragging across this sentence to select it while another app is focused.
			This text, and the Copy button below, are the only two things this test checks.
		</p>
		<button id="copy-btn">Copy</button>
		<div id="status">clicks: <span id="click-count">0</span></div>
		<div id="error" style="color: #fca5a5; font-size: 11px; margin-top: 4px; word-break: break-word;"></div>
	</div>

	<script>
		const statusEl = document.getElementById('click-count');
		const copyBtn = document.getElementById('copy-btn');
		const errorEl = document.getElementById('error');
		let clicks = 0;

		copyBtn.addEventListener('click', async () => {
			clicks += 1;
			statusEl.textContent = clicks;
			copyBtn.textContent = 'Copying...';
			errorEl.textContent = '';
			try {
				if (!window.__TAURI__) {
					throw new Error('window.__TAURI__ is missing in this webview');
				}
				await window.__TAURI__.core.invoke('spike_copy');
				copyBtn.textContent = 'Copied!';
			} catch (e) {
				copyBtn.textContent = 'Failed';
				errorEl.textContent = String(e && e.message ? e.message : e);
				console.error(e);
			}
			setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1000);
		});
	</script>
</body>
</html>
